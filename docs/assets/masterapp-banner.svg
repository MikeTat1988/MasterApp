<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MasterApp phone-first app package flow</title>
  <desc id="desc">Idea to ChatGPT ZIP to Google Drive to MasterApp to app on phone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="64" y="64" width="1152" height="592" rx="34" fill="#ffffff" stroke="#d9e2ec"/>

  <text x="96" y="122" fill="#111827" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">MasterApp</text>
  <text x="96" y="164" fill="#526070" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22">Phone-first AI-assisted app prototyping, backed by a local Windows host.</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(95 250)" filter="url(#shadow)">
      <rect width="168" height="202" rx="24" fill="#ffffff" stroke="#d9e2ec"/>
      <rect x="48" y="30" width="72" height="126" rx="20" fill="url(#screen)"/>
      <circle cx="84" cy="92" r="30" fill="#fbbf24"/>
      <path d="M84 52v80M44 92h80" stroke="#fff7d6" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <text x="84" y="176" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">Idea</text>
    </g>

    <path d="M284 351h58" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M335 337l16 14-16 14" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(368 250)" filter="url(#shadow)">
      <rect width="168" height="202" rx="24" fill="#ffffff" stroke="#d9e2ec"/>
      <rect x="34" y="34" width="100" height="88" rx="20" fill="#e8fff4" stroke="#93e7bf"/>
      <path d="M62 76c0-18 14-31 32-31 15 0 28 10 31 24 11 4 18 13 18 25 0 15-12 27-28 27H66c-17 0-30-12-30-28 0-12 8-23 20-27 2-7 4-13 6-18z" fill="#10a37f"/>
      <rect x="48" y="137" width="72" height="38" rx="10" fill="#eef2ff" stroke="#b8c2ff"/>
      <text x="84" y="162" text-anchor="middle" fill="#3b4bcc" font-size="18" font-weight="700">ZIP</text>
      <text x="84" y="196" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">ChatGPT</text>
    </g>

    <path d="M557 351h58" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M608 337l16 14-16 14" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(641 250)" filter="url(#shadow)">
      <rect width="168" height="202" rx="24" fill="#ffffff" stroke="#d9e2ec"/>
      <path d="M66 47h70l20 24v84c0 10-8 18-18 18H48c-10 0-18-8-18-18V65c0-10 8-18 18-18h18z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M66 47v25h90" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M84 82l-32 56h64l32-56z" fill="#34a853" opacity="0.9"/>
      <path d="M84 82l32 56h32l-32-56z" fill="#4285f4" opacity="0.92"/>
      <path d="M52 138l16 28h64l-16-28z" fill="#fbbc04" opacity="0.95"/>
      <text x="84" y="196" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">Drive</text>
    </g>

    <path d="M830 351h58" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M881 337l16 14-16 14" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(914 250)" filter="url(#shadow)">
      <rect width="168" height="202" rx="24" fill="#ffffff" stroke="#d9e2ec"/>
      <rect x="32" y="44" width="104" height="74" rx="10" fill="url(#screen)"/>
      <rect x="54" y="128" width="60" height="10" rx="5" fill="#94a3b8"/>
      <rect x="42" y="146" width="84" height="12" rx="6" fill="#cbd5e1"/>
      <circle cx="62" cy="80" r="10" fill="#38bdf8"/>
      <circle cx="84" cy="80" r="10" fill="#34d399"/>
      <circle cx="106" cy="80" r="10" fill="#f59e0b"/>
      <text x="84" y="196" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">MasterApp</text>
    </g>

    <path d="M1103 351h58" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M1154 337l16 14-16 14" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(1036 476)" filter="url(#shadow)">
      <rect width="168" height="90" rx="22" fill="#111827"/>
      <text x="84" y="38" text-anchor="middle" fill="#e5e7eb" font-size="18" font-weight="700">Validate</text>
      <text x="84" y="64" text-anchor="middle" fill="#a7f3d0" font-size="16">Install and host</text>
    </g>

    <g transform="translate(1038 238)" filter="url(#shadow)">
      <rect x="150" y="12" width="58" height="202" rx="22" fill="#111827"/>
      <rect x="158" y="34" width="42" height="144" rx="10" fill="#f8fafc"/>
      <rect x="165" y="46" width="28" height="28" rx="8" fill="#38bdf8"/>
      <rect x="165" y="82" width="28" height="28" rx="8" fill="#34d399"/>
      <rect x="165" y="118" width="28" height="28" rx="8" fill="#f59e0b"/>
      <circle cx="179" cy="193" r="5" fill="#e5e7eb"/>
      <text x="179" y="248" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">Phone</text>
    </g>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#526070">
    <text x="112" y="512">Describe</text>
    <text x="384" y="512">Package</text>
    <text x="660" y="512">Sync</text>
    <text x="930" y="512">Host</text>
    <text x="1138" y="622" text-anchor="middle">Iterate from screenshots</text>
  </g>
</svg>
